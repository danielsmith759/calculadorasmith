services:
  - type: web
    name: dtf-uv-smith
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Usuarios del panel: "usuario:clave,usuario2:clave2". Render la pide al crear el servicio.
      - key: ADMIN_USERS
        sync: false
      - key: NODE_VERSION
        value: 22
      # Dominios que pueden incrustar el cotizador, separados por coma: https://tuweb.com
      - key: EMBED_ORIGINS
        sync: false
      # Número de WhatsApp con indicativo, sin +: 573001234567
      - key: WHATSAPP
        sync: false
