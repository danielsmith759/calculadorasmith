<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin - Pedidos DTF UV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="contenedor">
  <h1>Pedidos DTF UV y vinilo</h1>
  <p><a href="stickers.html" style="color:#FFD700">Calculadora de stickers: cuántos caben y valor por unidad</a></p>
  <div id="login">
    <input id="user" placeholder="Usuario" autocomplete="username">
    <input type="password" id="pass" placeholder="Clave" autocomplete="current-password">
    <button id="enter">Entrar</button>
    <div id="err" class="msg err"></div>
  </div>
  <div id="panel" class="hidden">
    <button id="logout" class="sec" style="width:auto">Salir</button>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Ref</th><th>Fecha</th><th>Cliente</th><th>Estilo</th><th>Montaje</th><th>Total (sin IVA)</th><th>Estado</th><th>Archivo</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => '$' + Math.round(n).toLocaleString('es-CO');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function load() {
  const res = await fetch('/api/admin/orders');
  if (!res.ok) { $('login').classList.remove('hidden'); $('panel').classList.add('hidden'); return; }
  const orders = await res.json();
  $('login').classList.add('hidden'); $('panel').classList.remove('hidden');
  $('rows').innerHTML = orders.map((o) => `
    <tr>
      <td>${esc(o.id.slice(0, 8).toUpperCase())}</td>
      <td>${new Date(o.createdAt).toLocaleString('es-CO')}</td>
      <td>${esc(o.name)}<br><span class="muted">${esc(o.phone)}${o.note ? ' · ' + esc(o.note) : ''}${o.billing ? '<br>Factura: ' + esc([o.billing.empresa, o.billing.nit && 'NIT ' + o.billing.nit, o.billing.correo].filter(Boolean).join(' · ')) : ''}</span></td>
      <td>${esc(o.style)}${o.product === 'vinilo' ? `<br><span class="muted">${o.cutType === 'total' ? 'Corte total' : 'Medio corte'} · margen ${Math.round(o.offsetCm * 100) / 10} mm${(o.capas || []).length ? ' · capas: ' + o.capas.map(esc).join(' + ') : ''}</span>` : ''}</td>
      <td>${o.product === 'vinilo' ? o.widthCm : 58} × ${o.lengthCm} cm<br><span class="muted">${o.pieces} pzas · ${o.emptyPct}% vacío${o.gapCm ? ' · sep. ' + Math.round(o.gapCm * 10) + ' mm' : ''}</span>${(o.items || []).map((p) =>
        `<br><span class="${p.dpi < 150 ? 'err' : 'muted'}">${p.qty}× ${p.wCm}×${p.hCm} cm · ${p.dpi} ppp${p.dpi < 150 ? ' (baja)' : ''}</span>`).join('')}</td>
      <td>${fmt(o.price)}<br><span class="muted">${esc(o.detalle)}</span></td>
      <td><button data-id="${esc(o.id)}" data-status="${o.status === 'pendiente' ? 'impreso' : 'pendiente'}">${esc(o.status)}</button></td>
      <td>${(o.files || ['png']).map((k) => `<a href="/api/admin/orders/${esc(o.id)}/download/${k}">${k === 'svg' ? 'Corte SVG' : 'Descargar ' + k.toUpperCase()}</a>`).join(' ')}</td>
    </tr>`).join('') || '<tr><td colspan="8">Sin pedidos</td></tr>';
}

$('enter').addEventListener('click', async () => {
  const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: $('user').value, password: $('pass').value }) });
  if (res.ok) { $('err').textContent = ''; $('pass').value = ''; load(); }
  else $('err').textContent = (await res.json()).error;
});
$('logout').addEventListener('click', async () => { await fetch('/api/admin/logout', { method: 'POST' }); load(); });
$('rows').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  await fetch('/api/admin/orders/' + b.dataset.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: b.dataset.status }) });
  load();
});
load();
</script>
</body>
</html>
