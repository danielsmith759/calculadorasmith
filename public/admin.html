<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin - Pedidos DTF UV</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .contenedor { max-width: 1200px; }
    #rows td { overflow-wrap: anywhere; vertical-align: top; }
    #rows td:nth-child(3) { max-width: 260px; }
    #rows td:nth-child(3) .muted { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    #rows td:nth-child(3) .muted:hover { -webkit-line-clamp: unset; }
  </style>
</head>
<body>
<main class="contenedor">
  <h1>Pedidos DTF UV y vinilo</h1>
  <p><a href="stickers.html">Calculadora de stickers: cuántos caben y valor por unidad</a></p>
  <form id="login">
    <label for="user">Usuario</label>
    <input id="user" autocomplete="username" required>
    <label for="pass">Clave</label>
    <input type="password" id="pass" autocomplete="current-password" required>
    <button id="enter" type="submit">Entrar</button>
    <div id="err" class="msg err" role="alert"></div>
  </form>
  <div id="panel" class="hidden">
    <div class="row" style="align-items:center">
      <input id="q" type="search" placeholder="Buscar por referencia, nombre, teléfono o NIT" aria-label="Buscar pedidos">
      <select id="fEstado" aria-label="Filtrar por estado" style="max-width:180px"><option value="">Todos los estados</option></select>
      <button id="logout" class="sec" style="width:auto;flex:none">Salir</button>
    </div>
    <p class="muted" id="count"></p>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Ref</th><th>Fecha</th><th>Cliente</th><th>Estilo</th><th>Montaje</th><th>Total (sin IVA)</th><th>Estado</th><th>Archivo</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => '$' + Math.round(n).toLocaleString('es-CO');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ESTADOS = ['pendiente', 'pagado', 'impreso', 'cortado', 'entregado'];
// Búsqueda sin tildes ni mayúsculas ("nandu" encuentra "Ñandú").
const plain = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
$('fEstado').innerHTML += ESTADOS.map((e) => `<option value="${e}">${e[0].toUpperCase() + e.slice(1)}</option>`).join('');
let orders = [], estilos = {};
fetch('/api/config').then((r) => r.json()).then((c) => { for (const e of c.estilos) estilos[e.id] = e.nombre; render(); }).catch(() => {});
const wa = (phone) => { let d = String(phone).replace(/\D/g, ''); if (d.length === 10) d = '57' + d; return d.length >= 10 ? `https://wa.me/${d}` : ''; };

async function load() {
  const res = await fetch('/api/admin/orders');
  if (!res.ok) { $('login').classList.remove('hidden'); $('panel').classList.add('hidden'); return; }
  orders = await res.json();
  $('login').classList.add('hidden'); $('panel').classList.remove('hidden');
  render();
}
function render() {
  const q = plain($('q').value.trim()), est = $('fEstado').value;
  const list = orders.filter((o) => (!est || o.status === est) &&
    (!q || [o.id.slice(0, 8), o.name, o.phone, o.note, o.billing && o.billing.nit, o.billing && o.billing.empresa].map(plain).join(' ').includes(q)));
  $('count').textContent = `${list.length} de ${orders.length} pedidos`;
  $('rows').innerHTML = list.map((o) => `
    <tr>
      <td>${esc(o.id.slice(0, 8).toUpperCase())}</td>
      <td>${new Date(o.createdAt).toLocaleString('es-CO')}</td>
      <td>${esc(o.name)}<br><span class="muted">${wa(o.phone) ? `<a href="${wa(o.phone)}" target="_blank" rel="noopener">${esc(o.phone)}</a>` : esc(o.phone)}${o.note ? ' · ' + esc(o.note) : ''}${o.billing ? '<br>Factura: ' + esc([o.billing.empresa, o.billing.nit && 'NIT ' + o.billing.nit, o.billing.correo].filter(Boolean).join(' · ')) : ''}</span></td>
      <td>${esc(estilos[o.style] || o.style)}${o.maquina ? `<br><span class="muted">${esc(o.maquina)}</span>` : ''}${o.product === 'vinilo' ? `<br><span class="muted">${o.cutType === 'total' ? 'Corte total' : 'Medio corte'} · margen ${Math.round(o.offsetCm * 100) / 10} mm${(o.capas || []).length ? ' · capas: ' + o.capas.map(esc).join(' + ') : ''}</span>` : ''}</td>
      <td>${o.product === 'vinilo' ? o.widthCm : 58} × ${o.lengthCm} cm<br><span class="muted">${o.pieces} pzas · ${o.emptyPct}% vacío${o.gapCm ? ' · sep. ' + Math.round(o.gapCm * 10) + ' mm' : ''}</span>${(o.items || []).map((p) =>
        `<br><span class="${p.dpi < 150 ? 'err' : 'muted'}">${p.qty}× ${p.wCm}×${p.hCm} cm · ${p.dpi} ppp${p.dpi < 150 ? ' (baja)' : ''}${p.fondo ? ' · <b>fondo opaco</b>' : ''}</span>`).join('')}</td>
      <td>${fmt(o.price)}<br><span class="muted">${esc(o.detalle)}</span></td>
      <td><select style="min-width:130px" data-id="${esc(o.id)}" data-prev="${esc(o.status)}" aria-label="Estado del pedido ${esc(o.id.slice(0, 8).toUpperCase())}">${ESTADOS.map((e) => `<option${e === o.status ? ' selected' : ''}>${e}</option>`).join('')}</select></td>
      <td>${(o.files || ['png']).map((k) => `<a href="/api/admin/orders/${esc(o.id)}/download/${k}">${k === 'svg' ? 'Corte SVG' : 'Descargar ' + k.toUpperCase()}</a>`).join(' ')}</td>
    </tr>`).join('') || '<tr><td colspan="8">Sin pedidos</td></tr>';
}

$('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: $('user').value, password: $('pass').value }) });
  if (res.ok) { $('err').textContent = ''; $('pass').value = ''; load(); }
  else $('err').textContent = (await res.json()).error;
});
$('logout').addEventListener('click', async () => { await fetch('/api/admin/logout', { method: 'POST' }); load(); });
$('rows').addEventListener('change', async (e) => {
  const sel = e.target.closest('select[data-id]');
  if (!sel) return;
  if (sel.value === 'entregado' && !confirm('¿Marcar este pedido como entregado?')) { sel.value = sel.dataset.prev; return; }
  const r = await fetch('/api/admin/orders/' + sel.dataset.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: sel.value }) });
  if (!r.ok) alert('No se pudo cambiar el estado. Revisa tu sesión e intenta de nuevo.');
  load();
});
$('q').addEventListener('input', render);
$('fEstado').addEventListener('change', render);
load();
</script>
</body>
</html>
